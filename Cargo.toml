[package]
name = "hidden-vnc"
version = "0.1.0"
edition = "2021"
authors = ["Hidden VNC Team"]
description = "A custom Hidden Virtual Network Computing (HVNC) solution for Windows"
license = "MIT"

[[bin]]
name = "hvnc-server"
path = "src/bin/server.rs"

[[bin]]
name = "hvnc-client"
path = "src/bin/client.rs"

[[bin]]
name = "hvnc-gui-client"
path = "src/bin/gui_client.rs"

[[bin]]
name = "hvnc-service"
path = "src/bin/service.rs"

[[bin]]
name = "debug-pipeline"
path = "debug_pipeline.rs"

[[bin]]
name = "diagnostic"
path = "diagnostic.rs"

[[bin]]
name = "capture-test"
path = "capture_test.rs"

[[bin]]
name = "compare-jpeg-test"
path = "compare_jpeg_test.rs"

[[bin]]
name = "test-jpeg-compression"
path = "test_jpeg_compression.rs"

[[bin]]
name = "test-option-c"
path = "test_option_c.rs"

[[bin]]
name = "hvnc-server-config"
path = "src/bin/server_config.rs"

[[bin]]
name = "test-input-fix"
path = "test_input_fix.rs"

[[bin]]
name = "test-input"
path = "test_input.rs"

[[bin]]
name = "color-test"
path = "color_test.rs"

[[bin]]
name = "hvnc-input-test"
path = "hvnc_input_test.rs"

[dependencies]
# Windows API bindings for desktop and window management
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "processthreadsapi", "handleapi", 
    "errhandlingapi", "winbase", "memoryapi", "libloaderapi",
    "securitybaseapi", "synchapi"
] }

# Image processing and compression
image = { version = "0.24.7", features = ["jpeg", "png"] }

# Async runtime for network operations
tokio = { version = "1.0", features = ["full"] }

# Serialization for input events
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Additional dependencies for client display
minifb = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Command line argument parsing
clap = { version = "4.0", features = ["derive"] }

# Monitoring and metrics
once_cell = "1.19"

# Configuration file support
toml = "0.8"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Signal handling for service
ctrlc = "3.4"

# Windows system information
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["psapi"] }

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.0"
mockall = "0.11"

[package.metadata.bundle]
name = "Hidden VNC"
identifier = "com.hvnc.hidden-vnc"
version = "0.1.0"
copyright = "Copyright (c) 2024 Hidden VNC Team"
category = "Utility"
short_description = "Hidden Virtual Network Computing solution"
long_description = "A custom Hidden Virtual Network Computing (HVNC) solution for Windows"
icon = []
resources = []
windows = { wix = true }